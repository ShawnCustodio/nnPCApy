[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name            = "nnpcapy"
version         = "0.1.0"
description     = "Python port of R's nsprcomp (non-negative sparse PCA), with a timing benchmark vs the original."
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"
authors         = [
    { name = "Shawn Custodio", email = "shawncustodiomail@gmail.com" },
]
keywords        = ["nnpca", "nsprcomp", "sparse-pca", "non-negative", "gene-signature", "emt"]
classifiers     = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core solver (nnpcapy.nsprcomp) is NumPy-only. Everything else is opt-in.
dependencies    = [
    "numpy>=1.24",
]

[project.optional-dependencies]
app = [            # emtscore application layer: gene-set scoring & analysis
    "pandas>=2.0",
    "scipy>=1.10",
]
viz = [            # publication-quality plotting (e.g. Figure 3E)
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.10",   # gaussian_kde for the scatter density contours
    "pandas>=2.0",   # emtscore.single_cell (score_signature, plot_*) takes DataFrames directly
]
sc = [             # single-cell loaders / GMM / PCA collapse
    "anndata>=0.10",
    "scikit-learn>=1.3",
]
full = ["nnpcapy[app,viz,sc]"]
notebooks = [       # extra libs the two demo notebooks import that the library itself doesn't need
    "jupyter>=1.0",
    "plotly>=5.20",
]
benchmark = [
    "matplotlib>=3.8",
    "psutil>=5.9",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "build>=1.0",   # `python -m build` for wheel/sdist
]

[project.urls]
Source = "https://github.com/ShawnCustodio/nnPCApy"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Curated, reproducible profile (replaces any global config): pyflakes /
# pycodestyle + import sorting, bugbear, pyupgrade, simplify, and ruff rules.
# Bandit (S), blind-except (BLE), comprehension (C4), naming (N) and executable
# (EXE) are left out on purpose — the defensive try/except guards and the
# ssGSEA module name are intentional.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",                     # long scientific/formatting lines are fine
    "E701", "E702",             # compact one-line statements are used intentionally
    "RUF001", "RUF002", "RUF003",  # box-drawing separators + ×/≈/− math glyphs in text
    "SIM108",                   # explicit if/else can be clearer than a ternary
    "B905",                     # zip() strict= not required (lengths known equal)
]

[tool.hatch.build.targets.wheel]
packages = ["src/nnpcapy", "emtscore", "utility"]

# Ship the *small* data files (signatures, annotation, gene-set .gmt/.tsv) inside
# the wheel under nnpcapy/_bundled_data/. The large files (geneExp.csv, the full
# C2 .gmt, and the Cook single-cell CSVs) are intentionally left out — they come
# with a source checkout or via $NNPCAPY_DATA. See utility/data_paths.py.
[tool.hatch.build.targets.wheel.force-include]
"data/Panchy_et_al_E_signature.csv"         = "nnpcapy/_bundled_data/Panchy_et_al_E_signature.csv"
"data/Panchy_et_al_M_signature.csv"         = "nnpcapy/_bundled_data/Panchy_et_al_M_signature.csv"
"data/cell_annotation_file.csv"             = "nnpcapy/_bundled_data/cell_annotation_file.csv"
"data/EM_signature.gmt"                     = "nnpcapy/_bundled_data/EM_signature.gmt"
"data/filtered.c2.gmt"                      = "nnpcapy/_bundled_data/filtered.c2.gmt"
"data/degeneracy_demo.gmt"                  = "nnpcapy/_bundled_data/degeneracy_demo.gmt"
"data/TianLab_collected_EMT_signatures.gmt" = "nnpcapy/_bundled_data/TianLab_collected_EMT_signatures.gmt"
"data/stemsig.tsv"                          = "nnpcapy/_bundled_data/stemsig.tsv"
"data/cellular_senescence_sig.tsv"          = "nnpcapy/_bundled_data/cellular_senescence_sig.tsv"

[tool.hatch.build.targets.sdist]
include = [
    "src/nnpcapy",
    "emtscore",
    "utility",
    # small data only (same set the wheel bundles); large files ship with a checkout
    "data/Panchy_et_al_E_signature.csv",
    "data/Panchy_et_al_M_signature.csv",
    "data/cell_annotation_file.csv",
    "data/EM_signature.gmt",
    "data/filtered.c2.gmt",
    "data/degeneracy_demo.gmt",
    "data/TianLab_collected_EMT_signatures.gmt",
    "data/stemsig.tsv",
    "data/cellular_senescence_sig.tsv",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
